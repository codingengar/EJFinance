version: '3.8'

services:
  db:
    image: postgres:14
    container_name: ejfinance_db
    environment:
      POSTGRES_USER: ejfinance_user
      POSTGRES_PASSWORD: ejfinance_pass
      POSTGRES_DB: ejfinance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ejfinance_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: ejfinance_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ejfinance_user:ejfinance_pass@db:5432/ejfinance_db
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  nocodb:
    image: nocodb/nocodb:latest
    container_name: ejfinance_nocodb
    ports:
      - "8080:8080"
    environment:
      - NC_DB=pg://db:5432?u=ejfinance_user&p=ejfinance_pass&d=ejfinance_db
      - NC_AUTH_JWT_SECRET=your-jwt-secret-change-in-production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - nocodb_data:/usr/app/data

volumes:
  postgres_data:
  nocodb_data:

