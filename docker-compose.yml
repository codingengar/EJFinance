services:
  db:
    image: postgres:14
    container_name: ejfinance_db
    environment:
      POSTGRES_USER: ejfinance_user
      POSTGRES_PASSWORD: ejfinance_pass
      POSTGRES_DB: ejfinance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ejfinance_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ejfinance_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ejfinance_user:ejfinance_pass@db:5432/ejfinance_db
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: ejfinance_frontend
    command: npm run dev -- --hostname 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
